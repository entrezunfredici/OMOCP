<form class="doodoo-odoo-profile">
    <h2>Ajouter un profil odoo</h2>
    <div class="doodoo-grid">
        <label class="doodoo-field">
            <span>label</span>
            <input name="label" required/>
        </label>
        <label class="doodoo-field">
            <span>URL</span>
            <input name="url" required/>
        </label>
        <label class="doodoo-field">
            <span>db</span>
            <input name="db" required/>
        </label>
        <label class="doodoo-field">
            <span>Login</span>
            <input name="login" required />
        </label>
        <label class="doodoo-field">
            <span>password</span>
            <input name="password" type="password" autocomplete="off" required />
        </label>
    </div>
    <div class="doodoo-msg"></div>
    <div class="doodoo-actions">
        <button type="button" data-cancel>
            Annuler
        </button>
        <button class="primary" type="submit">Sauvegarder</button>
    </div>
</form>
