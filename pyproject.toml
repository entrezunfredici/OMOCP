[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, …)
    "I",   # isort
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (common bugs & design issues)
    "RUF", # Ruff-specific rules
]
ignore = [
    "RUF002", # ambiguous unicode in docstrings (multiplication sign × is intentional)
]
